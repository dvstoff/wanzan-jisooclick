name: Hourly sales scrape

on:
  schedule:
    # Scheduled at :55 rather than the top of the hour on purpose: every cron job on
    # GitHub piles up at :00, which is exactly when scheduled runs get delayed or
    # dropped. :55 dodges that jam — and since a run itself takes ~8-9 minutes, it
    # lands right around the new hour, so the data still reads as "fresh this hour".
    - cron: "55 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: hourly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium + system deps (incl. Xvfb)
        run: npx playwright install --with-deps chromium

      - name: Run scraper (headed, under a virtual display)
        # Ktown4u's sale-count widget appears to withhold data from browsers
        # flagged as automated (navigator.webdriver). Running Chromium headed
        # instead of headless avoids that flag — xvfb-run gives it a virtual
        # display to render into since this runner has no real screen.
        run: xvfb-run --auto-servernum npm run scrape

      - name: Commit updated data.json
        # scrape.js already wrote its result to the checked-out data.json (based on
        # whatever commit was HEAD ~9 minutes ago, at job start). If anyone else — a
        # manual admin upload, another run — pushed to data.json in the meantime,
        # committing that stale copy and then `git pull --rebase` would have to replay
        # our diff on top of a file that no longer matches, and a JSON array edited by
        # two different appends near the same line very often can't rebase cleanly
        # (this is exactly what "CONFLICT (content): Merge conflict in data.json" is).
        # So instead of rebasing a stale commit, every attempt re-fetches origin's
        # *current* data.json fresh and re-appends onto that, right before pushing —
        # there's nothing to conflict with because the base is always up to date. Only
        # a genuine same-second push race can still collide, so this retries a few
        # times with a short random backoff, same as the pattern used elsewhere in this
        # project for exactly this kind of contention.
        run: |
          git config user.name "wanzan-sales-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data.json /tmp/scraped-data.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node -e "
              const fs = require('fs');
              const fresh = JSON.parse(fs.readFileSync('data.json', 'utf8'));
              const scraped = JSON.parse(fs.readFileSync('/tmp/scraped-data.json', 'utf8'));
              const newBatch = scraped.batches[scraped.batches.length - 1];
              const alreadyThere = fresh.batches.some(function (b) { return b.ts === newBatch.ts; });
              if (!alreadyThere) fresh.batches.push(newBatch);
              // Re-sorted by timestamp every time: whoever's retry loop pushes last otherwise
              // just appends to whatever order origin happened to be in, and the frontend's
              // bucketing/forward-fill logic assumes batches are already chronological.
              fresh.batches.sort(function (a, b) { return new Date(a.ts) - new Date(b.ts); });
              fs.writeFileSync('data.json', JSON.stringify(fresh, null, 2) + '\n');
            "

            if git diff --quiet -- data.json; then
              echo "No changes to data.json this run."
              break
            fi

            git add data.json
            git commit -m "chore: hourly sales snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Pushed successfully (attempt $attempt)."
              break
            fi

            echo "Push rejected (attempt $attempt) — someone else pushed data.json in the meantime, retrying against the latest version..."
            git reset --soft HEAD~1
            if [ "$attempt" = "5" ]; then
              echo "::error::Gave up after 5 attempts — a human should check the repo."
              exit 1
            fi
            sleep $((RANDOM % 6 + attempt * 3))
          done
